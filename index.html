<template id="p1"><article class="page-inner"><h1>PRINCESS</h1><div class="date">HAPPY PRINCESS DAY — 18 NOVEMBER</div><div class="cover-photo"><img src="assets/photo-e026fed39e6f.jpg" alt="Bidisha smiling in a floral outfit against a warm palace wall"></div><span class="issue">VOL. 01 / A KEEPSAKE FOR YOU</span><div class="cover-story">A little chaos.<br>A lot of magic.<small>EVERY SHADE OF YOU, CELEBRATED.</small></div><div class="cover-bottom">The one and only Bidisha — Special Edition</div></article></template>
<template id="p2"><article class="page-inner letter"><div class="eyebrow"><span>From the editor</span><span>Unfiltered & heartfelt</span></div><h2>A Letter<br><em>For You.</em></h2><img class="portrait" src="assets/photo-d8a01492fb63.jpg" alt="Bidisha's candid outdoor smile"><p class="hand" style="font-size:20px">Dear Bidisha,</p><p>You are annoying. There, I said it. You can turn a tiny thing into a full debate, get angry in record time, and then be so unexpectedly cute that staying annoyed with you feels impossible.</p><p>But behind all of that is someone who cares. Someone who notices little things, feels everything a bit too deeply, and means more to me than she probably realises.</p><p>I like the real you. The overthinking you. The laughing-at-nothing you. Even the “I am not angry” you who is very obviously angry.</p><p>You don't have to be perfect to be my favourite person. Please keep being exactly this wonderfully impossible version of yourself.</p><div class="signature hand">Always in your corner,<br>your close friend ♡</div><div class="folio"><span>Princess / A letter worth keeping</span><span>02</span></div></article></template>

<template id="p9"><article class="page-inner extra wishes"><div class="eyebrow"><span>A wish for you</span><span>Today & always</span></div><h2>A softer world.<br><em>For your big heart.</em></h2><img class="wish-photo" src="assets/photo-0fe05f64a56f.jpg" alt="Bidisha smiling on a mountain adventure"><p>I hope you get more days that feel like your favourite song. More trips that turn into stories. More reasons to laugh until you forget what you were worried about.</p><p>I hope you feel appreciated on the ordinary days, too. And when life gets a little loud, I hope you remember that someone is always rooting for you.</p><div class="hand wish-sign">All the good things.<br>That's what I wish for you. ♡</div><div class="folio"><span>Princess / A little wish, a lot of love</span><span>09</span></div></article></template><script>
const $=s=>document.querySelector(s),book=$('#book'),left=$('#left'),right=$('#right'),flip=$('#flip');
const classes=['cover','letter','certificate','collage','essentials','friend','reasons','extra','extra','final'];let spread=0,busy=false;const lastSpread=5;
const pages=classes.map((cl,i)=>{let page=document.createElement('div');page.className='paper '+cl;page.innerHTML=$('#p'+(i+1)).innerHTML+'<div class="gutter"></div>';page.setAttribute('aria-label','Page '+(i+1));return page});
const imageReady=Promise.all(pages.flatMap(p=>[...p.querySelectorAll('img')].map(im=>im.decode().catch(()=>{}))));
function put(el,n,side){el.replaceChildren();el.hidden=!n;el.className='static '+side;if(n)el.append(pages[n-1]);}
function render(){put(left,spread?spread*2:0,'left');put(right,spread<lastSpread?spread*2+1:0,'right');book.classList.toggle('center-cover',spread===0);book.classList.toggle('center-back',spread===lastSpread);$('#counter').textContent=spread===0?'THE COVER · 01':spread===lastSpread?'WITH LOVE · 10':String(spread*2).padStart(2,'0')+' — '+String(spread*2+1).padStart(2,'0')+' / 10';$('#dots').innerHTML=Array.from({length:6},(_,i)=>'<i class="'+(i===spread?'active':'')+'"></i>').join('');$('#prev').disabled=spread===0;$('#next').disabled=spread===lastSpread;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Reuse decoded page DOM and let the compositor animate a curved paper mesh.
// Each face is painted once per turn, never rebuilt inside an animation frame.
const curlCache=new Map(),SEGMENTS=12,SEGMENT_WIDTH=500/SEGMENTS;
function curlGeometry(p){let x=0,z=0;const result=[];const bend=.62*Math.sin(Math.PI*p);for(let i=0;i<SEGMENTS;i++){const u=(i+.5)/SEGMENTS,angle=-Math.PI*p+bend*Math.sin((u-.5)*Math.PI);result.push({transform:'translate3d('+x+'px,0,'+(z+.5)+'px) rotateY('+angle+'rad)',shade:Math.abs(Math.sin(angle))*.24});x+=Math.cos(angle)*SEGMENT_WIDTH;z-=Math.sin(angle)*SEGMENT_WIDTH;}return result;}
const curlFrames=Array.from({length:61},(_,i)=>curlGeometry(i/60));
function getCurl(base){if(curlCache.has(base))return curlCache.get(base);const layer=document.createElement('div');layer.className='curl-mesh';layer.setAttribute('aria-hidden','true');const strips=[];
for(let i=0;i<SEGMENTS;i++){const strip=document.createElement('div');strip.className='curl-strip';strip.style.width=(SEGMENT_WIDTH+.4)+'px';const shades=[];for(let side=0;side<2;side++){const face=document.createElement('div');face.className='curl-face'+(side?' reverse':'');const page=pages[base*2+side].cloneNode(true);page.style.left=-(side?500-(i+1)*SEGMENT_WIDTH:i*SEGMENT_WIDTH)+'px';page.classList.remove('reveal');page.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));page.querySelectorAll('path[fill]').forEach(el=>{if(el.getAttribute('fill').startsWith('url('))el.setAttribute('fill','#bd344e')});const shade=document.createElement('div');shade.className='curl-shade';face.append(page,shade);strip.append(face);shades.push(shade);}layer.append(strip);strips.push({strip,shades});}
const entry={layer,strips};curlCache.set(base,entry);if(curlCache.size>2){const oldest=curlCache.keys().next().value;curlCache.delete(oldest);}return entry;}
async function turn(dir){if(busy||spread+dir<0||spread+dir>lastSpread)return;busy=true;startMusic();$('#next').disabled=$('#prev').disabled=true;const base=dir===1?spread:spread-1,target=spread+dir;let mesh;
try{await imageReady;if(reduced){spread=target;return;}mesh=getCurl(base);const initial=curlFrames[dir===1?0:60];mesh.strips.forEach(({strip,shades},i)=>{strip.style.transform=initial[i].transform;shades.forEach(s=>s.style.opacity=initial[i].shade)});
await Promise.all([...mesh.layer.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
flip.append(mesh.layer);put(left,base?base*2:0,'left');put(right,base<lastSpread-1?base*2+3:0,'right');book.classList.toggle('center-cover',target===0);book.classList.toggle('center-back',target===lastSpread);
const options={duration:1200,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'},animations=[];
mesh.strips.forEach(({strip,shades},i)=>{let frames=curlFrames.map((f,k)=>({transform:f[i].transform,offset:k/60}));let lighting=curlFrames.map((f,k)=>({opacity:f[i].shade,offset:k/60}));if(dir<0){frames=frames.reverse().map((f,k)=>({...f,offset:k/60}));lighting=lighting.reverse().map((f,k)=>({...f,offset:k/60}));}animations.push(strip.animate(frames,options));shades.forEach(shade=>animations.push(shade.animate(lighting,options)));});
const shadow=$('#shadow').animate([{opacity:0},{opacity:.65,offset:.5},{opacity:0}],options);animations.push(shadow);await Promise.all(animations.map(a=>a.finished));spread=target;render();mesh.layer.remove();animations.forEach(a=>a.cancel());
}catch(error){console.error('Page turn recovered',error);spread=target;}finally{if(mesh)mesh.layer.remove();busy=false;render();}}
$('#next').onclick=()=>turn(1);$('#prev').onclick=()=>turn(-1);right.onclick=()=>turn(1);left.onclick=()=>turn(-1);$('#restart').onclick=()=>{if(busy)return;spread=0;render()};document.addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();turn(1)}if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}});let touchX;book.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>45){turn(delta<0?1:-1);e.preventDefault()}},{passive:false});
function resize(){let s=Math.min((innerWidth-40)/1000,(innerHeight-335)/660,1);s=Math.max(.28,s);$('#fit').style.transform=`scale(${s})`;$('#viewport').style.height=660*s+18+'px'}addEventListener('resize',resize);resize();render();$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('#hint').textContent='Use your browser fullscreen shortcut for an immersive view.'}};
let playing=false,started=false,objectURL=null;const seek=$('#seek'),audio=new Audio('assets/tum-se-hi.mp3');audio.loop=true;audio.volume=.25;audio.preload='metadata';$('#trackName').textContent='Tum Se Hi';$('#trackSub').textContent='Jab We Met · Your soundtrack';
function ui(){playing=!audio.paused;$('#player').classList.toggle('playing',playing);$('#play').textContent=playing?'Ⅱ':'▶';$('#play').setAttribute('aria-label',playing?'Pause background music':'Play background music')}
audio.addEventListener('loadedmetadata',()=>{seek.max=Number.isFinite(audio.duration)?audio.duration:120});audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime});audio.addEventListener('play',ui);audio.addEventListener('pause',ui);audio.addEventListener('error',()=>{$('#trackSub').textContent='Unable to play this audio file';ui()});
async function toggle(){started=true;try{if(audio.paused)await audio.play();else audio.pause()}catch{$('#trackSub').textContent='Tap play to start Tum Se Hi'}ui()}
function startMusic(){if(!started){started=true;audio.play().catch(()=>{started=false})}}$('#play').onclick=toggle;document.addEventListener('pointerdown',e=>{if(!e.target.closest('.player'))startMusic()});seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(seek.value)};$('#song').onchange=async e=>{let file=e.target.files[0];if(!file)return;audio.pause();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(file);audio.src=objectURL;$('#trackName').textContent=file.name.replace(/\.[^.]+$/,'').slice(0,28);$('#trackSub').textContent='Your personal soundtrack';await toggle()};
</script></body></html>
